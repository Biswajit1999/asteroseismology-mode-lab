name: Scientific Python diagnostics
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python-science:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-science.txt
      - run: python -m pytest -q tests/test_seismic_diagnostics.py
      - run: python scripts/run_seismic_diagnostics.py
      - run: python scripts/plot_seismic_diagnostics.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm run validate:research
